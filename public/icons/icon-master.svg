<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Master app icon. Usado pra gerar todos os derivados:
      - PWA (icon-192, icon-512, maskable, apple-touch-icon)
      - Favicon (favicon-16, favicon-32)
      - App Store icon (1024×1024 sem alpha) → icon-store-master.svg
      - mipmap Android, AppIcon iOS

    Variação atual: stroke escuro sobre fundo claro mint — pedida
    pelo user pra usar como app icon na home screen do iPhone (PWA
    installed). Antes era mint sobre gradient escuro.

    Composição:
      - rect 512x512 com cantos arredondados rx=96 (estilo iOS)
        em mint claro (brand-50 #f4faf6)
      - infinity outline (peanut horizontal) em verde escuro
        (#0d3030, dark forest/teal alinhado com a paleta)
      - Path geométrico: 2 círculos r=130 em (170,256) e (342,256)
        sobrepostos horizontalmente
  -->
  <rect width="512" height="512" rx="96" fill="#f4faf6"/>
  <path
    d="M 256 158.5
       A 130 130 0 1 1 256 353.5
       A 130 130 0 1 1 256 158.5
       Z"
    stroke="#0d3030"
    stroke-width="46"
    stroke-linejoin="round"
    fill="none"
  />
</svg>
