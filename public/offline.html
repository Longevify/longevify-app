<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline · Longevify</title>
  <meta name="theme-color" content="#1f5d3f" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f4faf6;
      color: #0d2818;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
      width: 100%;
      background: #fff;
      border: 1px solid #e7f5ec;
      border-radius: 16px;
      padding: 32px;
      text-align: center;
      box-shadow: 0 12px 32px -16px rgba(13, 40, 24, 0.18);
    }
    .icon {
      display: inline-flex;
      width: 56px;
      height: 56px;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background: #1f5d3f;
      color: #fff;
      font-weight: 700;
      font-size: 26px;
      letter-spacing: -1px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.3px;
      margin-bottom: 8px;
    }
    p {
      font-size: 14px;
      line-height: 1.5;
      color: #4b5d56;
      margin-bottom: 20px;
    }
    button {
      cursor: pointer;
      background: #1f5d3f;
      color: #fff;
      border: none;
      border-radius: 9999px;
      padding: 10px 20px;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.2px;
      transition: background-color 0.15s ease;
    }
    button:hover { background: #123e2a; }
    .small {
      margin-top: 14px;
      font-size: 12px;
      color: #8a9994;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="icon">L</div>
    <h1>Sem conexão</h1>
    <p>
      Você está offline. Suas informações já carregadas continuam acessíveis nos cards principais — mas pra dados novos, precisa de internet.
    </p>
    <button onclick="location.reload()">Tentar novamente</button>
    <div class="small">Longevify · plataforma de longevidade</div>
  </main>
</body>
</html>
